    </marker>
  </defs>
  <style>
    .body,.head,.shirt,.far,.fixture,.arrow,.highlight { stroke-linecap: round; stroke-linejoin: round; }
    .body,.head,.shirt { stroke: #142f35; stroke-width: 7; }
    .body,.far,.fixture,.arrow,.highlight { fill: none; }
    .head { fill: #f8ece0; stroke-width: 5; }
    .shirt { fill: #b7ded4; stroke-width: 5; }
    .far { stroke: #526f71; stroke-width: 6; }
