<svg xmlns="http://www.w3.org/2000/svg" width="360" height="224" viewBox="0 0 360 224" role="img" aria-labelledby="title desc">
  <title id="title">Vstajanje s stola</title>
  <desc id="desc">Oseba se pomakne naprej, se odrine z naslonjala za roke in se dvigne s stola.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#086953"/>
    </marker>
  </defs>
  <style>
    .body,.head,.shirt,.far,.fixture,.arrow,.highlight { stroke-linecap: round; stroke-linejoin: round; }
    .body,.head,.shirt { stroke: #142f35; stroke-width: 7; }
    .body,.far,.fixture,.arrow,.highlight { fill: none; }
    .head { fill: #f8ece0; stroke-width: 5; }
    .shirt { fill: #b7ded4; stroke-width: 5; }
    .far { stroke: #526f71; stroke-width: 6; }
    .fixture { stroke: #70888a; stroke-width: 4; }
    .arrow { stroke: #086953; stroke-width: 4.5; marker-end: url(#tip); }
